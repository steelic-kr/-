<style id="page-style">
/* Layout: 기록부 — 요약 숫자 한 줄, 티어 분포 막대, 그 아래 필터와 클리어 목록 (좁은 화면에서는 행이 카드로). 편집 모드에서는 행마다 수정·삭제, 아래에 저장 막대 */
:root {
  --bg: #eef0f5;
  --surface: #ffffff;
  --line: #d9dce6;
  --fg: #171a26;
  --muted: #5f6577;
  --accent: #d0263b;      /* 익스트림 데몬 얼굴의 붉은색 */
  --gang: #1a66e0;        /* 갱 = 파란 글자 */
  --hover: #f3f5fa;
  --chip-ink: #ffffff;
  --shadow: 0 10px 40px rgba(20, 24, 40, .18);
  --display: "Oxanium", "IBM Plex Sans KR", system-ui, sans-serif;
  --body: "IBM Plex Sans KR", system-ui, -apple-system, "Malgun Gothic", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #10121b; --surface: #171a26; --line: #2a2f40; --fg: #e8eaf2; --muted: #9298ab;
    --accent: #ff5167; --gang: #6ea2ff; --hover: #1d2130; --chip-ink: #10121b; --shadow: 0 10px 40px rgba(0,0,0,.5); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #10121b; --surface: #171a26; --line: #2a2f40; --fg: #e8eaf2; --muted: #9298ab;
  --accent: #ff5167; --gang: #6ea2ff; --hover: #1d2130; --chip-ink: #10121b; --shadow: 0 10px 40px rgba(0,0,0,.5); color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 15px; line-height: 1.5; }
.wrap { max-width: 1120px; margin: 0 auto; padding-inline: 20px; padding-block: 40px 96px; display: grid; gap: 28px; }
.wrap > * { min-width: 0; }

header { display: grid; grid-template-columns: 1fr auto; gap: 6px 16px; align-items: end; }
header > div { display: grid; gap: 6px; min-width: 0; }
.eyebrow { font-family: var(--mono); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); }
h1 { font-family: var(--display); font-weight: 800; font-size: clamp(30px, 5vw, 46px); line-height: 1.05; margin: 0; text-wrap: balance; letter-spacing: -.01em; }
.sub { color: var(--muted); margin: 0; }
.head-actions { display: flex; gap: 8px; flex-wrap: wrap; }

.btn { font: inherit; font-size: 14px; font-weight: 500; color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 7px; padding: 7px 14px; cursor: pointer; white-space: nowrap; }
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { filter: brightness(1.08); color: #fff; }
.btn.on { border-color: var(--accent); color: var(--accent); font-weight: 700; }
.btn:disabled { opacity: .5; cursor: default; }
.btn.small { font-size: 12.5px; padding: 3px 9px; border-radius: 5px; }
.btn.danger:hover { border-color: var(--accent); color: var(--accent); }

.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.stat { background: var(--surface); padding: 16px 18px; display: grid; gap: 2px; min-width: 0; }
.stat .k { font-size: 12px; color: var(--muted); letter-spacing: .04em; }
.stat .v { font-family: var(--display); font-weight: 700; font-size: 28px; font-variant-numeric: tabular-nums; line-height: 1.15; overflow-wrap: anywhere; }
.stat .v small { font-size: 14px; font-weight: 500; color: var(--muted); }
.stat .note { font-size: 12.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

section > h2 { font-family: var(--display); font-size: 18px; font-weight: 700; margin: 0 0 12px; display: flex; align-items: baseline; gap: 10px; }
section > h2 span { font-family: var(--body); font-size: 13px; font-weight: 400; color: var(--muted); }

.tiers { display: grid; gap: 6px; }
.tier-row { display: grid; grid-template-columns: 110px 1fr 34px; align-items: center; gap: 10px; font-size: 13px; background: none; border: 0; padding: 2px 0; color: inherit; font: inherit; text-align: left; cursor: pointer; border-radius: 4px; }
.tier-row:hover .bar-track { background: var(--hover); }
.tier-row.on .tname { font-weight: 700; }
.tier-row.dim { opacity: .4; }
.tname { color: var(--fg); white-space: nowrap; }
.bar-track { height: 14px; border-radius: 3px; position: relative; }
.bar { height: 100%; border-radius: 3px; min-width: 3px; }
.tcount { font-family: var(--mono); font-variant-numeric: tabular-nums; text-align: right; color: var(--muted); }

.legend { display: flex; flex-wrap: wrap; gap: 8px 20px; font-size: 13px; color: var(--muted); padding: 12px 14px; border: 1px dashed var(--line); border-radius: 8px; }
.legend b, .legend .g, .legend s { color: var(--fg); }
.legend .g { color: var(--gang); }

.controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 12px; }
.controls input[type=search], .controls select { font: inherit; font-size: 14px; color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 7px; padding: 8px 10px; }
.controls input[type=search] { flex: 1 1 220px; min-width: 0; }
.toggle { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; cursor: pointer; user-select: none; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; background: var(--surface); }
.seg button { font: inherit; font-size: 13.5px; color: var(--muted); background: none; border: 0; padding: 7px 12px; cursor: pointer; white-space: nowrap; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button:hover { color: var(--fg); background: var(--hover); }
.seg button[aria-checked="true"] { background: var(--fg); color: var(--bg); font-weight: 700; }
.count { font-family: var(--mono); font-size: 13px; color: var(--muted); margin-left: auto; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.table-box { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { padding: 10px 10px; text-align: left; white-space: nowrap; }
thead th { font-size: 12px; font-weight: 500; color: var(--muted); letter-spacing: .04em; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--surface); }
thead th button { all: unset; cursor: pointer; display: inline-flex; gap: 4px; align-items: center; }
thead th button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
thead th .arr { opacity: 0; font-size: 10px; }
thead th.sorted .arr { opacity: 1; color: var(--accent); }
tbody tr { border-top: 1px solid var(--line); }
tbody tr:first-child { border-top: 0; }
tbody tr:hover { background: var(--hover); }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; text-align: right; }
td.idx { color: var(--muted); font-size: 12.5px; }
td.date { font-family: var(--mono); font-size: 13px; color: var(--muted); }
.lvl { font-weight: 500; font-size: 15px; }
.lvl.nh { font-weight: 700; }
.lvl.gang { color: var(--gang); }
.lvl.private { text-decoration: line-through; text-decoration-thickness: 1.5px; }
.creator { color: var(--muted); max-width: 220px; overflow: hidden; text-overflow: ellipsis; }
.chip { display: inline-block; font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 4px; color: var(--chip-ink); white-space: nowrap; }
.wf.fluke { font-weight: 700; }
.wf .x { color: var(--muted); font-size: 12px; margin-left: 3px; font-weight: 400; }
.badge { font-family: var(--mono); font-size: 10.5px; letter-spacing: .06em; border: 1px solid currentColor; color: var(--accent); border-radius: 3px; padding: 0 4px; margin-left: 6px; vertical-align: 2px; }
.play { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 500; color: var(--fg); text-decoration: none; border: 1px solid var(--line); border-radius: 999px; padding: 4px 11px 4px 9px; }
.play:hover { border-color: var(--accent); color: var(--accent); }
.play svg { width: 11px; height: 11px; fill: currentColor; }
.play.locked { color: var(--muted); border-style: dashed; }
.novid { color: var(--muted); font-size: 13px; }
.empty { padding: 32px; text-align: center; color: var(--muted); }
td.act { display: none; }
.editing td.act, .editing th.act { display: table-cell; }
th.act { display: none; }
td.act { text-align: right; }
td.act .btn + .btn { margin-left: 6px; }
tr.changed td.name::after { content: "수정됨"; font-size: 11px; color: var(--accent); margin-left: 8px; }

/* 개인 난이도 순위 */
td.rk { padding-right: 0; }
.rk-n { display: inline-grid; place-items: center; min-width: 30px; height: 24px; padding: 0 6px; border-radius: 6px; background: var(--hover); border: 1px solid var(--line); font-family: var(--mono); font-size: 12.5px; font-weight: 600; font-variant-numeric: tabular-nums; }
.rk-n.top { background: var(--accent); border-color: var(--accent); color: #fff; }

/* Enjoyment */
.enj { display: inline-flex; align-items: center; gap: 8px; justify-content: flex-end; }
.enj-bar { width: 44px; height: 5px; border-radius: 3px; background: var(--hover); border: 1px solid var(--line); overflow: hidden; }
.enj-bar i { display: block; height: 100%; background: var(--gang); }
.enj.none { color: var(--muted); }

/* Unrated: 회색으로 구분, 개수에서 빠짐 */
tr.unrated td, tr.unrated .lvl, tr.unrated .lvl.gang { color: var(--muted); }
tr.unrated .chip { background: var(--line) !important; color: var(--muted) !important; }
tr.unrated .rk-n { opacity: .6; }
.ur { font-family: var(--mono); font-size: 10.5px; letter-spacing: .06em; border: 1px solid var(--muted); color: var(--muted); border-radius: 3px; padding: 0 4px; margin-left: 6px; vertical-align: 2px; }
.legend .u { color: var(--muted); }

/* 순위 정하기 창 */
#rankDlg { width: min(480px, calc(100% - 32px)); }
#rankDlg .inner { display: grid; gap: 12px; padding: 20px; }
#rankDlg p { margin: 0; font-size: 13px; color: var(--muted); }
.rank-list { list-style: none; margin: 0; padding: 4px; max-height: min(60vh, 520px); overflow-y: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); display: grid; gap: 3px; overscroll-behavior: contain; }
.rank-list li { display: grid; grid-template-columns: 26px 34px 1fr auto; align-items: center; gap: 8px; padding: 6px 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; font-size: 14px; user-select: none; cursor: grab; }
.rank-list li .grip { color: var(--muted); font-size: 15px; line-height: 1; text-align: center; touch-action: none; cursor: grab; padding: 4px 0; }
.rank-list li .no { font-family: var(--mono); font-size: 12.5px; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
.rank-list li .nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rank-list li .tr { font-size: 11.5px; color: var(--muted); white-space: nowrap; }
.rank-list li.me { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); font-weight: 700; }
.rank-list li.me .no { color: var(--accent); }
.rank-list li.dragging { opacity: .85; box-shadow: var(--shadow); border-color: var(--accent); cursor: grabbing; position: relative; z-index: 1; }
.rank-list li:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.rank-tools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.rank-tools .btn { padding: 5px 10px; font-size: 13px; }
.rank-field { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 14px; color: var(--fg); }
.rank-field b { font-family: var(--mono); }

footer { font-size: 12.5px; color: var(--muted); }

/* 저장 막대 */
.savebar { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); width: min(640px, calc(100% - 32px)); display: flex; flex-wrap: wrap; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px 10px 16px; box-shadow: var(--shadow); z-index: 5; }
.savebar .msg { flex: 1 1 200px; font-size: 14px; min-width: 0; }
.savebar .msg b { color: var(--accent); }

/* 수정 창 */
dialog { border: 1px solid var(--line); border-radius: 12px; padding: 0; background: var(--surface); color: var(--fg); width: min(560px, calc(100% - 32px)); box-shadow: var(--shadow); }
dialog::backdrop { background: rgba(10, 12, 20, .45); }
dialog form { display: grid; gap: 14px; padding: 20px; }
dialog h3 { font-family: var(--display); font-size: 20px; margin: 0; }
.fields { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.fields label { display: grid; gap: 4px; font-size: 13px; color: var(--muted); min-width: 0; }
.fields label.full { grid-column: 1 / -1; }
.fields input, .fields select { font: inherit; font-size: 15px; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 7px; padding: 8px 10px; width: 100%; min-width: 0; }
.fields .hint { font-size: 12px; }
.checks { display: flex; flex-wrap: wrap; gap: 8px 18px; }
.checks .toggle { color: var(--fg); }
.dlg-actions { display: flex; justify-content: flex-end; gap: 8px; }
.err { color: var(--accent); font-size: 13px; margin: 0; min-height: 1em; }

@media (max-width: 760px) {
  header { grid-template-columns: 1fr; }
  header .btn { justify-self: start; }
  .tier-row { grid-template-columns: 92px 1fr 28px; }
  .table-box { background: none; border: 0; overflow: visible; }
  table, tbody { display: block; }
  thead { display: none; }
  tbody tr { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin-bottom: 10px; }
  tbody tr:first-child { border-top: 1px solid var(--line); }
  td { padding: 0; white-space: normal; }
  td.idx { display: none; }
  td.rk { grid-column: 1; grid-row: 1; align-self: center; }
  td.name { grid-column: 2; grid-row: 1; min-width: 0; align-self: center; }
  td.tier { grid-column: 3; grid-row: 1; text-align: right; align-self: center; }
  td.creator { grid-column: 1 / -1; grid-row: 2; max-width: none; font-size: 13px; }
  td.date { grid-column: 1 / -1; grid-row: 3; font-size: 12.5px; }
  td.att, td.wf, td.enjc { text-align: left; font-size: 13px; grid-column: 1 / 3; }
  td.att { grid-row: 4; }
  td.wf { grid-row: 5; }
  td.enjc { grid-row: 6; }
  .enj { justify-content: flex-start; }
  td.att::before { content: "어템 "; color: var(--muted); font-family: var(--body); }
  td.wf::before { content: "Worst Fail "; color: var(--muted); font-family: var(--body); font-weight: 400; }
  td.enjc::before { content: "Enjoyment "; color: var(--muted); font-family: var(--body); font-size: 13px; margin-right: 6px; }
  td.enjc { display: flex; align-items: center; }
  td.vid { grid-column: 3; grid-row: 4 / 7; align-self: end; }
  td.date::after { content: attr(data-n); margin-left: 8px; }
  .editing td.act { display: block; grid-column: 1 / -1; grid-row: 7; text-align: left; padding-top: 6px; border-top: 1px dashed var(--line); margin-top: 4px; }
  .stats { grid-template-columns: 1fr 1fr; }
  .fields { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: no-preference) {
  .bar { transition: width .5s ease; }
}
</style>

document.getElementById("app").innerHTML = SHELL;

// NLW 티어 순서와 색 (쉬운 쪽은 초록, 어려울수록 붉고 짙게)
const TIERS = ["Beginner","Easy","Medium","Hard","Very Hard","Insane","Extreme","Remorseless","Relentless","Terrifying","Catastrophic"];
const TIER_COLOR = ["#3fae5a","#7cb83a","#c2b52a","#e39a25","#e7722a","#e24a32","#d2263f","#b51f5b","#8f2a7a","#62308c","#2e2a5e"];
const FLUKE_BELOW = 70;

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmt = n => n.toLocaleString("ko-KR");
const safeUrl = u => /^https?:\/\//i.test(u || "") ? u : "";
const newKey = () => "r" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const tierIdx = t => Math.max(0, TIERS.indexOf(t));
const byRank = (a, b) => (a.rank ?? 1e9) - (b.rank ?? 1e9);

const SAVED = JSON.parse(document.getElementById("data").textContent);
SAVED.forEach((r, i) => { r.key ||= "s" + i; });
// 순위가 없는 기록은 티어가 높은 순으로 맨 뒤에 붙입니다
(function normalizeRanks() {
  const ranked = SAVED.filter(r => Number.isFinite(r.rank)).sort(byRank);
  const rest = SAVED.filter(r => !Number.isFinite(r.rank)).sort((a, b) => tierIdx(b.tier) - tierIdx(a.tier));
  [...ranked, ...rest].forEach((r, i) => { r.rank = i + 1; });
})();

let records, order, editing = false, changedKeys, deletedCount, rankTouched;
function resetEdits() {
  records = SAVED.map(r => ({ ...r }));                 // 편집 중인 사본
  order = [...records].sort(byRank).map(r => r.key);    // 개인 난이도 순위 (0번이 1위)
  changedKeys = new Set(); deletedCount = 0; rankTouched = false;
}
resetEdits();

// 기록 → 화면용 레벨 목록. 번호(#)는 Unrated를 뺀 날짜순입니다.
let levels = [];
function build() {
  const rankOf = new Map(order.map((k, i) => [k, i + 1]));
  const sorted = records.map((r, i) => [r, i]).sort((a, b) => a[0].date < b[0].date ? -1 : a[0].date > b[0].date ? 1 : a[1] - b[1]).map(x => x[0]);
  let n = 0;
  levels = sorted.map(r => {
    const attNum = parseInt(String(r.att).replace(/[^\d]/g, ""), 10);
    const m = String(r.wf).match(/(\d+)\s*%?(?:\s*x\s*(\d+))?/i);
    const wf = m ? +m[1] : null;
    return {
      ...r, n: r.unrated ? null : ++n, tierIdx: tierIdx(r.tier), rank: rankOf.get(r.key),
      attNum: isNaN(attNum) ? null : attNum,
      wf, wfTimes: m && m[2] ? +m[2] : 1, wfRaw: r.wf,
      fluke: wf !== null && wf < FLUKE_BELOW, reclear: wf === 100,
      enj: Number.isFinite(r.enj) ? r.enj : null, most: false,
    };
  });
  const withAtt = levels.filter(l => l.attNum !== null);
  if (withAtt.length) withAtt.reduce((a, b) => b.attNum > a.attNum ? b : a).most = true;
}

// 요약 (Unrated는 개수에 넣지 않습니다)
function renderSummary() {
  const rated = levels.filter(l => !l.unrated);
  const unrated = levels.length - rated.length;
  if (!levels.length) { $("#span").textContent = "아직 기록이 없습니다"; $("#stats").innerHTML = ""; return; }
  const pool = rated.length ? rated : levels;
  const hardest = pool.filter(l => l.nh).at(-1) || pool.reduce((a, b) => b.tierIdx >= a.tierIdx ? b : a);
  const most = levels.find(l => l.most);
  const total = levels.reduce((s, l) => s + (l.attNum || 0), 0);
  const rated_enj = levels.filter(l => l.enj !== null);
  const avg = rated_enj.length ? rated_enj.reduce((s, l) => s + l.enj, 0) / rated_enj.length : null;
  const best = rated_enj.length ? rated_enj.reduce((a, b) => b.enj > a.enj ? b : a) : null;
  $("#span").textContent = `${levels[0].date} 첫 클리어부터 ${levels.at(-1).date}까지`;
  $("#stats").innerHTML = `
    <div class="stat"><span class="k">클리어</span><span class="v">${rated.length}<small> 개</small></span><span class="note">플루크 ${rated.filter(l => l.fluke).length}개${unrated ? ` · Unrated ${unrated}개 별도` : ""}</span></div>
    <div class="stat"><span class="k">하디스트</span><span class="v" style="font-size:22px">${esc(hardest.name)}</span><span class="note">${esc(hardest.tier)} · ${esc(hardest.date)}</span></div>
    <div class="stat"><span class="k">총 어템</span><span class="v">${fmt(total)}<small>+</small></span><span class="note">${most ? `최다 ${esc(most.name)} ${esc(most.att)}` : ""}</span></div>

const collator = new Intl.Collator("en", { sensitivity: "base", numeric: true });
const SORTERS = {
  abc: (a, b) => collator.compare(a.name, b.name),
  date: (a, b) => levels.indexOf(b) - levels.indexOf(a),

function renderRows() {

  let list = levels.filter(l =>
    (!q || l.name.toLowerCase().includes(q) || String(l.creator).toLowerCase().includes(q)) &&

      <td class="num att">${esc(l.att)}</td>
      <td class="num wf${bold ? " fluke" : ""}"${l.fluke ? ' title="플루크"' : l.reclear ? ' title="재클리어"' : ""}>${wfText}</td>

const toISO = d => /^\d{4}\.\d{2}\.\d{2}$/.test(d) ? d.replace(/\./g, "-") : "";

function readEnj(v) {
  if (String(v).trim() === "") return { ok: true, val: null };
  const n = Number(v);
  if (!Number.isFinite(n) || n < 0 || n > 10) return { ok: false };
  return { ok: true, val: Math.round(n * 10) / 10 };
}

$("#okBtn").addEventListener("click", e => {
  const f = form.elements;

  const err = !f.date.value ? "클리어 날짜를 넣어 주십시오."
    : !f.name.value.trim() ? "레벨명을 넣어 주십시오."
    : !enj.ok ? "Enjoyment는 0에서 10 사이 숫자로 넣어 주십시오 (소수점 한 자리까지)."
    : f.url.value.trim() && !safeUrl(f.url.value.trim()) ? "영상 링크는 http:// 또는 https:// 로 시작해야 합니다." : "";
  if (err) { e.preventDefault(); $("#formErr").textContent = err; return; }
  const rec = {
    date: fromISO(f.date.value), name: f.name.value.trim(), creator: f.creator.value.trim(), tier: f.tier.value,
    att: f.att.value.trim() || "???", wf: f.wf.value.trim(), url: f.url.value.trim(),
    gang: f.gang.checked, priv: f.priv.checked, nh: f.nh.checked, unrated: f.unrated.checked, enj: enj.val,
  };
  let key = editingKey;

$("#rows").addEventListener("click", e => {

    records = records.filter(x => x !== r);

// ---------- 순위 정하기 창 (끌어서 놓기) ----------
const rankList = $("#rankList");
let rankMode = null;   // "form": 수정 창의 한 맵 / "all": 전체 순위 편집
let rankMe = null;

function nameOf(k) {
  if (k === NEW) return form.elements.name.value.trim() || "(새 맵)";
  if (rankMode === "form" && k === editingKey) return form.elements.name.value.trim() || records.find(r => r.key === k).name;
  return records.find(r => r.key === k)?.name ?? "?";
}
function tierOf(k) {
  if (k === NEW || (rankMode === "form" && k === editingKey)) return form.elements.tier.value;
  return records.find(r => r.key === k)?.tier ?? "";
}
function renumber() {
  [...rankList.children].forEach((li, i) => { li.querySelector(".no").textContent = i + 1; });
}
function openRank(mode, keys, me) {
  rankMode = mode; rankMe = me;
  rankList.innerHTML = keys.map(k => `
    <li data-k="${esc(k)}" tabindex="0" class="${k === me ? "me" : ""}">
      <span class="grip" aria-hidden="true">⋮⋮</span><span class="no"></span>
      <span class="nm">${esc(nameOf(k))}</span><span class="tr">${esc(tierOf(k))}</span>
    </li>`).join("");
  renumber();
  $("#rankHelp").textContent = me
    ? "위가 가장 어렵습니다. 빨간 테두리가 이 맵입니다. 끌어서 원하는 자리에 놓거나 아래 버튼으로 옮기십시오."
    : "위가 가장 어렵습니다. 아무 줄이나 끌어서 순서를 바꾸십시오. 줄을 누른 뒤 버튼이나 ↑↓ 키로도 옮길 수 있습니다.";
  selected = me ? rankList.querySelector("li.me") : null;
  $("#rankDlg").showModal();
  (selected || rankList.firstElementChild)?.scrollIntoView({ block: "center" });
  selected?.focus({ preventScroll: true });
}

let selected = null;
function select(li) {
  if (rankMode === "form") return;   // 수정 창에서는 이 맵만 움직입니다
  rankList.querySelectorAll("li.me").forEach(x => x.classList.remove("me"));
  selected = li; li?.classList.add("me");
}
function move(li, where) {
  if (!li) return;
  const items = [...rankList.children];
  const i = items.indexOf(li);
  if (where === "top") rankList.prepend(li);
  else if (where === "bottom") rankList.append(li);
  else if (where === -1 && i > 0) rankList.insertBefore(li, items[i - 1]);
  else if (where === 1 && i < items.length - 1) rankList.insertBefore(li, items[i + 1].nextSibling);
  renumber();
  li.scrollIntoView({ block: "nearest" });
  li.focus({ preventScroll: true });
}
$("#rankTools").addEventListener("click", e => {
  const b = e.target.closest("[data-mv]"); if (!b) return;
  const v = b.dataset.mv;
  move(selected, v === "top" || v === "bottom" ? v : +v);
});
rankList.addEventListener("keydown", e => {
  const li = e.target.closest("li"); if (!li) return;
  if (rankMode === "form" && !li.classList.contains("me")) return;
  if (e.key === "ArrowUp" || e.key === "ArrowDown") { e.preventDefault(); select(li); move(li, e.key === "ArrowUp" ? -1 : 1); }
});

// 포인터로 끌기: 마우스는 줄 어디든, 터치는 왼쪽 ⋮⋮ 손잡이로
let drag = null;
rankList.addEventListener("pointerdown", e => {
  const li = e.target.closest("li"); if (!li) return;
  if (e.pointerType !== "mouse" && !e.target.closest(".grip")) return;
  if (e.button > 0) return;
  if (rankMode === "form" && !li.classList.contains("me")) return;
  select(li);
  e.preventDefault();
  li.setPointerCapture(e.pointerId);
  li.classList.add("dragging");
  drag = { li, id: e.pointerId, y: e.clientY, timer: null };
  drag.timer = setInterval(autoScroll, 30);
});
function autoScroll() {
  if (!drag) return;
  const r = rankList.getBoundingClientRect();
  const edge = 44;
  if (drag.y < r.top + edge) rankList.scrollTop -= Math.ceil((r.top + edge - drag.y) / 4);
  else if (drag.y > r.bottom - edge) rankList.scrollTop += Math.ceil((drag.y - (r.bottom - edge)) / 4);
  place();
}
function place() {
  const { li, y } = drag;
  const others = [...rankList.children].filter(x => x !== li);
  const before = others.find(x => { const b = x.getBoundingClientRect(); return y < b.top + b.height / 2; });
  if ((before || null) !== li.nextElementSibling) {
    rankList.insertBefore(li, before || null);
    renumber();
  }
}
window.addEventListener("pointermove", e => {
  if (!drag || e.pointerId !== drag.id) return;
  drag.y = e.clientY;
  place();
});
function endDrag(e) {
  if (!drag || (e && e.pointerId !== drag.id)) return;
  clearInterval(drag.timer);
  drag.li.classList.remove("dragging");
  drag.li.focus({ preventScroll: true });
  drag = null;
}
window.addEventListener("pointercancel", endDrag);
window.addEventListener("pointerup", endDrag);
$("#rankDlg").addEventListener("close", () => endDrag());
rankList.addEventListener("click", e => { const li = e.target.closest("li"); if (li) select(li); });

$("#rankCancel").addEventListener("click", () => $("#rankDlg").close());
$("#rankOk").addEventListener("click", () => {
  const keys = [...rankList.children].map(li => li.dataset.k);
  if (rankMode === "form") { formOrder = keys; showFormRank(); }
  else if (keys.join() !== order.join()) { order = keys; rankTouched = true; update(); }
  $("#rankDlg").close();
});
$("#rankPick").addEventListener("click", () => openRank("form", formOrder, editingKey || NEW));
$("#rankAllBtn").addEventListener("click", () => openRank("all", order, null));

// 페이지 전체를 지금 기록으로 다시 만듭니다 (도구가 게시하는 모양 그대로)
const PREFIX = '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>';
const HEAD = '<title>Extreme Demon 클리어 기록</title>\n<link rel="preconnect" href="https://fonts.googleapis.com">\n<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>\n<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oxanium:wght@500;700;800&family=IBM+Plex+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap">\n';
function pageHTML(recs) {
  const json = JSON.stringify(recs, null, 0).replace(/</g, "\\u003c").replace(/\},\{/g, "},\n{");
  return PREFIX + HEAD +
    '<style id="page-style">' + $("#page-style").textContent + '</style>\n\n<div id="app"></div>\n\n' +
    '<script type="application/json" id="data">' + json + '</scr' + 'ipt>\n\n' +
    '<script id="main">' + $("#main").textContent + '</scr' + 'ipt>\n</body></html>';
}

$("#saveBtn").addEventListener("click", async () => {
  if (!artifact) return;
  const btn = $("#saveBtn");
  btn.disabled = true; btn.textContent = "저장 중…";
  const out = levels.map(({ key, date, name, creator, tier, att, wfRaw, url, gang, priv, nh, unrated, rank, enj }) =>
    ({ key, date, name, creator, tier, att, wf: wfRaw, url, gang, priv, nh, unrated: !!unrated, rank, enj }));
  try {
    await artifact.publish(pageHTML(out));   // 성공하면 새 버전으로 다시 열립니다
    $("#saveMsg").textContent = "저장했습니다. 새 버전을 불러오는 중…";
  } catch (err) {
    btn.disabled = false; btn.textContent = "저장";
    const code = err && err.code;
    if (code === "conflict") $("#saveMsg").textContent = "그 사이 다른 곳에서 페이지가 바뀌어 새 버전을 다시 불러옵니다. 이번 변경은 다시 해 주십시오.";
    else if (code === "not_writer" || code === "not_granted" || code === "consent_required" || code === "not_declared" || code === "capability_disabled" || code === "capability_removed")
      readOnly("이 화면에서는 편집 권한이 없어 저장할 수 없습니다.");
    else if (code === "rate_limited") $("#saveMsg").textContent = "저장이 너무 잦습니다. 잠시 뒤 다시 눌러 주십시오.";
    else $("#saveMsg").textContent = "저장하지 못했습니다. 잠시 뒤 다시 눌러 주십시오.";
  }
});

window.addEventListener("beforeunload", e => { if (editing && pendingCount() > 0) { e.preventDefault(); e.returnValue = ""; } });

// 편집 권한이 있는 화면에서만 편집·추가 버튼을 보여 줍니다. 링크로 보러 온 사람에게는 보기 화면만 나옵니다
(async () => {
  try {
    if (!window.claude || !window.claude.use) return;
    artifact = await window.claude.use("artifact");
    if (!artifact) return;
    const user = await window.claude.use("user");
    if (!user || !(await user.canEdit())) return;   // 편집 권한이 확인된 사람(소유자 등)에게만
    $("#editBtn").hidden = false; $("#newBtn").hidden = false;
  } catch (e) {}
})();
</script>
